name: Tenways Bike Depot Check

on:
  schedule:
    # Runs every day at 19:00 Amsterdam time (17:00 UTC in summer CEST)
    - cron: '0 17 * * *'
  workflow_dispatch: # allows manual trigger from GitHub website

jobs:
  check-depot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Fietsdepot checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check_tenways.py

  check-marktplaats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Marktplaats checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check_marktplaats.py
